spring:
  application:
    name: sales-insight

  # --- Datasource ---
  datasource:
    url: jdbc:postgresql://localhost:5432/salesinsight
    username: salesinsight
    password: salesinsight
    driver-class-name: org.postgresql.Driver

  # --- JPA ---
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- Redis ---
  data:
    redis:
      host: localhost
      port: 6379

  # --- RabbitMQ ---
  rabbitmq:
    host: localhost
    port: 5672
    username: salesinsight
    password: salesinsight
    listener:
      simple:
        acknowledge-mode: manual      # ACK manual para controle de retry
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
          multiplier: 2.0
          max-interval: 10000ms

  # --- Mail ---
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# --- Server ---
server:
  port: 8080

# --- JWT ---
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000  # 24h

# --- APIs Externas ---
ai:
  whisper:
    api-key: ${OPENAI_API_KEY}
    url: https://api.openai.com/v1/audio/transcriptions
    model: whisper-1
  gemini:
    api-key: ${GEMINI_API_KEY}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# --- Storage ---
storage:
  type: local
  local:
    upload-dir: ./uploads

# --- Cache ---
cache:
  insights:
    ttl-seconds: 3600  # 1h

# --- Logging ---
logging:
  level:
    com.salesinsight: DEBUG
    org.springframework.amqp: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] [%X{userId}] %-5level %logger{36} - %msg%n"

---
# =====================
# PROFILE: prod
# =====================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  jpa:
    show-sql: false

logging:
  level:
    com.salesinsight: INFO
  pattern:
    console: '{"timestamp":"%d","level":"%level","requestId":"%X{requestId}","userId":"%X{userId}","logger":"%logger","message":"%msg"}%n'